let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,1.65);W=Math.floor(innerWidth*dpr);H=Math.floor(innerHeight*dpr);if(canvas.width!==W||canvas.height!==H){canvas.width=fx.width=W;canvas.height=fx.height=H;gl.viewport(0,0,W,H)}}addEventListener('resize',resize);resize();gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.002,.007,.016,1);
const state={running:false,paused:false,over:false,time:0,distance:0,x:0,vx:0,target:0,speed:38,boost:100,boosting:false,shake:0,flash:0};let obstacles=[],portals=[],rivals=[],particles=[],nextSpawn=65,nextPortal=110;const lanes=[-7.5,-3.75,0,3.75,7.5],rnd=(a,b)=>a+Math.random()*(b-a),choose=a=>a[Math.random()*a.length|0];
function reset(){Object.assign(state,{running:true,paused:false,over:false,time:0,distance:0,x:0,vx:0,target:0,speed:38,boost:100,boosting:false,shake:0,flash:0});obstacles=[];portals=[];rivals=[];particles=[];nextSpawn=65;nextPortal=95;for(let i=0;i<3;i++)spawnRival(-55-i*44);$('#screen').classList.add('hidden');$('#pause').textContent='Ⅱ'}

const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space')state.boosting=true;if(e.code==='KeyP'||e.code==='Escape')togglePause();if(state.over&&(e.code==='Enter'||e.code==='Space'))reset()});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')state.boosting=false});let touchX=null;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(touchX===null||!state.running)return;const dx=(e.clientX-touchX)/Math.max(innerWidth,320);state.target=Math.max(-8.7,Math.min(8.7,state.target+dx*21));touchX=e.clientX});canvas.addEventListener('pointerup',()=>touchX=null);canvas.addEventListener('pointercancel',()=>touchX=null);

function update(dt){if(!state.running||state.paused||state.over)return;state.time+=dt;let steer=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);if(steer)state.target=Math.max(-8.7,Math.min(8.7,state.target+steer*dt*10.5));const diff=state.target-state.x;state.vx+=(diff*13-state.vx*5.5)*dt;state.x+=state.vx*dt;const canBoost=state.boosting&&state.boost>0,targetSpeed=canBoost?62:Math.min(48,38+state.distance*.00055);state.speed+=(targetSpeed-state.speed)*dt*2.7;if(canBoost){state.boost=Math.max(0,state.boost-dt*24);state.shake=Math.max(state.shake,.08)}else state.boost=Math.min(100,state.boost+dt*5.5);const dz=state.speed*dt;state.distance+=dz;for(const o of obstacles)o.z+=dz;for(const p of portals){p.z+=dz;p.rot+=dt*1.7}for(const r of rivals){r.z+=Math.max(7,state.speed-r.speed)*dt;r.phase+=dt}nextSpawn-=dz;nextPortal-=dz;if(nextSpawn<0){spawnObstacle(-215);nextSpawn=rnd(48,76)}if(nextPortal<0){spawnPortal(-225);nextPortal=rnd(105,155)}if(rivals.length<5&&Math.random()<dt*.08)spawnRival(-210);for(const o of obstacles){if(!o.passed&&o.z<2.5&&o.z>-3&&Math.abs(o.x-state.x)<(o.type==='wall'?1.5:1.2)){crash();return}if(!o.passed&&o.z>4){o.passed=true;state.distance+=8}}for(const p of portals)if(!p.taken&&Math.abs(p.z)<3.2&&Math.abs(p.x-state.x)<1.8){p.taken=true;state.boost=Math.min(100,state.boost+35);state.distance+=35;state.flash=.35;burst(innerWidth*.5,innerHeight*.42,'#58f7ff',25);message('PORTAL DE ENERGIA +35')}for(const r of rivals)if(r.alive&&Math.abs(r.z)<3.8&&Math.abs(r.x-state.x)<1.4){crash();return}obstacles=obstacles.filter(o=>o.z<14);portals=portals.filter(p=>p.z<14&&!p.taken);rivals=rivals.filter(r=>r.z<15&&r.z>-260);state.shake=Math.max(0,state.shake-dt);state.flash=Math.max(0,state.flash-dt);for(const p of particles){p.life-=dt;p.x+=p.vx;p.y+=p.vy;p.vy+=dt*9}particles=particles.filter(p=>p.life>0);$('#score').textContent=String(Math.floor(state.distance)).padStart(5,'0');$('#speed').textContent=Math.floor(state.speed*8.2);$('#boostFill') function drawWorld(){gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const shake=state.shake?rnd(-state.shake,state.shake):0,lean=Math.max(-.08,Math.min(.08,-state.vx*.012));gl.uniformMatrix4fv(loc.proj,false,M.perspective(Math.PI/2.55,W/H,.08,330));gl.uniformMatrix4fv(loc.view,false,M.view(state.x+shake,2.25+Math.sin(state.time*12)*.015,3.2,lean,Math.sin(state.time*.7)*.006));box(0,-.18,-115,22,.25,260,C.road);const scroll=state.distance%10;for(let z=10-scroll;z>-245;z-=10)box(0,.002,z,21.8,.018,.035,C.cyan2,.72);for(let x=-11;x<=11;x+=2.75)box(x,.008,-115,.026,.025,260,C.cyan2,.5);box(-11,.25,-115,.1,.5,260,C.cyan,.9);box(11,.25,-115,.1,.5,260,C.cyan,.9);const worldStep=Math.floor(state.distance/18);for(let z=-15;z>-250;z-=18){const iz=Math.floor(-z/18)+worldStep;for(const side of[-1,1]){const seed=Math.abs(Math.sin(iz*91.17+side*8.2)),h=4+seed*17,x=side*(14+seed*7);box(x,h/2-.1,z,3+seed*5,h,5+seed*4,C.dark);box(x-side*(1.53+seed*2.5),h*.58,z-.1,.035,h*.28,5.2+seed*4,C.cyan2,.7)}}for(let z=-35-(state.distance*1.1%60);z>-260;z-=60){box(-10.7,4.5,z,.16,9,.18,C.cyan,.8);box(10.7,4.5,z,.16,9,.18,C.cyan,.8);box(0,8.9,z,21.5,.14,.18,C.cyan,.8)}for(const o of obstacles){if(o.z>12||o.z<-250)continue;if(o.type==='wall'){box(o.x,1.05,o.z,2.7,2.1,.42,C.dark);box(o.x,1.05,o.z-.23,2.5,1.9,.035,C.orange,1);box(o.x,1.05,o.z-.27,1.65,.08,.04,C.white,1)}else{box(o.x,.65,o.z,2.05,1.3,2.1,C.dark);box(o.x,.67,o.z-1.08,1.65,.8,.04,C.red,1)}}for(const p of portals){if(p.z>12||p.z<-250)continue;draw(ring,M.trs(p.x,2.25,p.z,2.25,2.25,2.25),C.cyan,1);box(p.x,2.25,p.z,.035,3.25,.035,C.white,1)}for(const r of rivals){if(r.z>12||r.z<-250)continue;box(r.x,.25,r.z-7,.07,.2,14,r.color,.95);drawBike(r.x,r.z,r.color)}box(state.x,-.12,1.12,1.48,.35,2.6,C.black,0,lean);box(state.x,.08,.62,.18,.09,1.35,C.cyan,1,lean);box(state.x-1.02,.42,.68,1.2,.075,.08,C.cyan,.8,lean,-.12);box(state.x+1.02,.42,.68,1.2,.075,.08,C.cyan,.8,lean,.12);box(state.x-1.56,.52,.7,.5,.16,.16,C.dark,0,lean);box(state.x+1.56 function drawFx(){fctx.clearRect(0,0,W,H);fctx.save();fctx.scale(dpr,dpr);const w=W/dpr,h=H/dpr;if(state.running&&!state.paused){const power=Math.max(0,(state.speed-38)/24);fctx.lineWidth=1;for(let i=0;i<22*power;i++){const x=rnd(0,w),y=rnd(h*.32,h),len=rnd(8,55)*power;fctx.strokeStyle=`rgba(88,247,255,${rnd(.06,.28)})`;fctx.beginPath();fctx.moveTo(x,y);fctx.lineTo(x+(x-w/2)*.025*power,y+len);fctx.stroke()}}for(const p of particles){fctx.fillStyle=p.color;fctx.globalAlpha=Math.min(1,p.life*2);fctx.fillRect(p.x-2,p.y-2,4,4)}fctx.globalAlpha=1;if(state.flash){fctx.fillStyle=`rgba(${state.over?'255,85,20':'88,247,255'},${state.flash*.9})`;fctx.fillRect(0,0,w,h)}fctx.restore()}
